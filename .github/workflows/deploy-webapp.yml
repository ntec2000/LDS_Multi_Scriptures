name: Deploy web app to GitHub Pages

# Publishes the web app bundle (lds-webapp-*.zip) attached to a release,
# and updates README.md on main from the same bundle.
# Run manually: Actions > Deploy web app to GitHub Pages > Run workflow (optionally enter a tag).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (empty = latest release)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web app bundle from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -e
          mkdir -p site
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'lds-webapp-*.zip' --output web.zip
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern 'lds-webapp-*.zip' --output web.zip
          fi
          unzip -q web.zip -d site
          touch site/.nojekyll
          ls -la site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  sync-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update README.md from release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -e
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'lds-webapp-*.zip' --output /tmp/web.zip
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern 'lds-webapp-*.zip' --output /tmp/web.zip
          fi
          unzip -o -j -q /tmp/web.zip README.md -d /tmp/r
          cp /tmp/r/README.md README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then echo "README unchanged"; else git commit -m "Update README from release ${TAG:-latest}" && git push; fi
